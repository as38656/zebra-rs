# b — PE that imports the VPN routes of a into VRF cust. Its direct link to
# a is the one that fails; the other way to a goes through c.
#
# b makes its new LSP 300 ms after the adjacency goes down, so SPF always
# runs first, while b's own LSP still lists a. With the default timers SPF
# and the new LSP wait the same time, and either one can run first.
vrf:
- name: cust
  ipv4:
    route-target:
      import:
      - 65000:100
      export:
      - 65000:100
  ipv6:
    route-target:
      import:
      - 65000:100
      export:
      - 65000:100
interface:
- if-name: lo
  ipv6:
    address: 2001:db8::2/128
segment-routing:
  locator:
  - name: LOC2
    prefix: fcbb:bbbb:2::/48
    behavior: usid
router:
  isis:
    net: 49.0000.0000.0000.0002.00
    hostname: b
    is-type: level-2-only
    lsp-gen-interval:
      initial-wait: 300
      secondary-wait: 300
      maximum-wait: 2000
    spf-interval:
      maximum-wait: 2000
    segment-routing:
      srv6:
        locator: LOC2
    interface:
    - if-name: lo
      ipv6:
        enabled: true
    - if-name: t-a
      network-type: point-to-point
      metric: 10
      ipv6:
        enabled: true
      bfd:
        enabled: true
    - if-name: t-c
      network-type: point-to-point
      metric: 10
      ipv6:
        enabled: true
      bfd:
        enabled: true
  bgp:
    global:
      as: 65000
      router-id: 10.0.0.2
    segment-routing:
      srv6:
        locator: LOC2
    neighbor:
    - remote-address: 2001:db8::1
      remote-as: 65000
      update-source: 2001:db8::2
      timers:
        connect-retry-time: 3
      enabled: true
      afi-safi:
      - name: vpnv4
        enabled: true
      - name: vpnv6
        enabled: true
    vrf:
    - name: cust
      rd: 65000:2
      encapsulation: srv6
