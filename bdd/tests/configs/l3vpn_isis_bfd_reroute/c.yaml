# c — core router on the other way between a and b. IS-IS only.
interface:
- if-name: lo
  ipv6:
    address: 2001:db8::3/128
segment-routing:
  locator:
  - name: LOC3
    prefix: fcbb:bbbb:3::/48
    behavior: usid
router:
  isis:
    net: 49.0000.0000.0000.0003.00
    hostname: c
    is-type: level-2-only
    lsp-gen-interval:
      secondary-wait: 200
      maximum-wait: 2000
    spf-interval:
      maximum-wait: 2000
    segment-routing:
      srv6:
        locator: LOC3
    interface:
    - if-name: lo
      ipv6:
        enabled: true
    - if-name: t-a
      network-type: point-to-point
      metric: 10
      ipv6:
        enabled: true
      bfd:
        enabled: true
    - if-name: t-b
      network-type: point-to-point
      metric: 10
      ipv6:
        enabled: true
      bfd:
        enabled: true
