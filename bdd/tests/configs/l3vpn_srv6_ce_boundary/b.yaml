# b — PE that imports the VPN routes of a into VRF cust and sends them to
# the CE over an IPv4 and an IPv6 eBGP session. The IPv4 session sends the
# Prefix-SID (`prefix-sid send`) so the CE can show that it drops it; the
# IPv6 session keeps the default and does not send it.
vrf:
- name: cust
  ipv4:
    route-target:
      import:
      - 65000:100
      export:
      - 65000:100
  ipv6:
    route-target:
      import:
      - 65000:100
      export:
      - 65000:100
interface:
- if-name: lo
  ipv6:
    address: 2001:db8::2/128
- if-name: t-ce
  vrf: cust
  ipv4:
    address: 10.1.0.1/30
  ipv6:
    address: 2001:db8:1e::1/64
segment-routing:
  locator:
  - name: LOC2
    prefix: fcbb:bbbb:2::/48
    behavior: usid
router:
  isis:
    net: 49.0000.0000.0000.0002.00
    hostname: b
    is-type: level-2-only
    segment-routing:
      srv6:
        locator: LOC2
    interface:
    - if-name: lo
      ipv6:
        enabled: true
    - if-name: t-a
      network-type: point-to-point
      metric: 10
      ipv6:
        enabled: true
  bgp:
    global:
      as: 65000
      router-id: 10.0.0.2
    timer:
      adv-interval:
        ebgp: 1
    segment-routing:
      srv6:
        locator: LOC2
    neighbor:
    - remote-address: 2001:db8::1
      remote-as: 65000
      update-source: 2001:db8::2
      timers:
        connect-retry-time: 3
      enabled: true
      afi-safi:
      - name: vpnv4
        enabled: true
      - name: vpnv6
        enabled: true
    vrf:
    - name: cust
      rd: 65000:2
      encapsulation: srv6
      neighbor:
      - remote-address: 10.1.0.2
        remote-as: 65100
        timers:
          connect-retry-time: 3
        afi-safi:
        - name: ipv4
          enabled: true
          prefix-sid:
            send: true
      - remote-address: 2001:db8:1e::2
        remote-as: 65100
        timers:
          connect-retry-time: 3
        afi-safi:
        - name: ipv6
          enabled: true
