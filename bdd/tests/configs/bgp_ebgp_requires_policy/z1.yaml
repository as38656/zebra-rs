# z1 (AS 65001) sets `ebgp-requires-policy true` and binds no policy at
# start, so RFC 8212 closes both directions of both sessions.
policy:
- name: PERMIT-ALL
  entry:
  - number: 10
    action: permit
interface:
- if-name: z2
  ipv4:
    address: 192.168.0.1/24
  ipv6:
    address: 2001:db8:12::1/64
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    ebgp-requires-policy: true
    timer:
      adv-interval:
        ebgp: 1
    neighbor:
    - remote-address: 192.168.0.2
      remote-as: 65002
      timers: {connect-retry-time: 3}
      enabled: true
      afi-safi:
      - name: ipv4
        enabled: true
    - remote-address: 2001:db8:12::2
      remote-as: 65002
      timers: {connect-retry-time: 3}
      enabled: true
      afi-safi:
      - name: ipv6
        enabled: true
    afi-safi:
    - name: ipv4
      network:
      - prefix: 10.0.0.1/32
    - name: ipv6
      network:
      - prefix: 2001:db8:1::/64
