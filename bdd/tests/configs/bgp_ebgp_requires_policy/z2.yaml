# z2 (AS 65002) has no policy and keeps the default `ebgp-requires-policy`
# (off), so it sends and accepts every route.
interface:
- if-name: z1
  ipv4:
    address: 192.168.0.2/24
  ipv6:
    address: 2001:db8:12::2/64
router:
  bgp:
    global:
      as: 65002
      router-id: 192.168.0.2
    timer:
      adv-interval:
        ebgp: 1
    neighbor:
    - remote-address: 192.168.0.1
      remote-as: 65001
      timers: {connect-retry-time: 3}
      enabled: true
      afi-safi:
      - name: ipv4
        enabled: true
    - remote-address: 2001:db8:12::1
      remote-as: 65001
      timers: {connect-retry-time: 3}
      enabled: true
      afi-safi:
      - name: ipv6
        enabled: true
    afi-safi:
    - name: ipv4
      network:
      - prefix: 10.0.0.2/32
    - name: ipv6
      network:
      - prefix: 2001:db8:2::/64
